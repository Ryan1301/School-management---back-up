<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F5F3EF; --surface: #FFFFFF; --border: #E0DDD8;
  --text: #1A1A1A; --muted: #7A7670; --accent: #2B5BA8;
  --accent-bg: #EEF3FB; --success: #1E7A4A; --success-bg: #EAFAF1;
  --warning: #9A6F00; --warning-bg: #FEF9E7;
  --font: 'IBM Plex Sans', sans-serif; --mono: 'IBM Plex Mono', monospace;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.header-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.header-icon svg { width: 18px; height: 18px; }
.header-title { font-size: 15px; font-weight: 600; }
.header-sub { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 1px; }
.page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
.welcome { text-align: center; margin-bottom: 36px; }
.welcome h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
.welcome p { font-size: 14px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; width: 100%; max-width: 640px; }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; max-width: 360px; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 20px; text-decoration: none; color: var(--text); display: flex; flex-direction: column; gap: 10px; transition: box-shadow 0.15s, border-color 0.15s; }
.card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); border-color: #c8c4be; }
.card-icon { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.card-icon.blue { background: var(--accent-bg); }
.card-icon.green { background: var(--success-bg); }
.card-icon.yellow { background: var(--warning-bg); }
.card-icon svg { width: 20px; height: 20px; }
.card-title { font-size: 14px; font-weight: 600; }
.card-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.card-arrow { font-size: 16px; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
  </div>
  <div>
    <div class="header-title">School Portal</div>
    <div class="header-sub">select an option to continue</div>
  </div>
</div>
<div class="page">
  <div class="welcome">
    <h1>Welcome</h1>
    <p>Select and Continue</p>
  </div>
  <div class="cards">
    <a class="card" href="student.html">
      <div class="card-icon blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2B5BA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div class="card-title">Student</div>
      <div class="card-desc">Check your fine record and payment status.</div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="login.html">
      <div class="card-icon yellow">
        <svg viewBox="0 0 24 24" fill="none" stroke="#9A6F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <div class="card-title">Staff</div>
      <div class="card-desc">Admin, teachers and class teachers sign in here.</div>
      <div class="card-arrow">→</div>
    </a>
    <a class="card" href="inquiry.html">
      <div class="card-icon green">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1E7A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div class="card-title">Admission</div>
      <div class="card-desc">Parents can submit an admission inquiry here.</div>
      <div class="card-arrow">→</div>
    </a>
  </div>
</div>
</body>
</html>
